services:
  db:
    container_name: db
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: example_db
    ports:
      - 5431:5432
    volumes:
      - postgresdata:/var/lib/postgresql/data
  web:
    container_name: web
    build:
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tmp:/app/tmp
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  postgresdata:
